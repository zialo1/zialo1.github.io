url:
  # BAFU/Lindas - SPARQL (6-stellige Unique-ID: bafusp, 5-stellige Zugriffsart: sparq)
  bafusp:
    access: sparq
    url: https://lindas.admin.ch/query
  # PEGELONLINE WSV - REST (6-stellige Unique-ID: pegelo, 5-stellige Zugriffsart: resta)
  pegelo:
    access: resta
    url: https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations.json?waters=RHEIN&includeTimeseries=true&includeCurrentMeasurement=true
  # OpenTopoMap - Tiles (6-stellige Unique-ID: otopom, 5-stellige Zugriffsart: tiles)
  otopom:
    access: tiles
    url: https://a.tile.opentopomap.org/{z}/{tx}/{ty}.png
